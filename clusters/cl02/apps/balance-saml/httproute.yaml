apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balance-saml
  namespace: balance-saml
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    external-dns.alpha.kubernetes.io/exclude: "true"
    active-passive.arencloud.com/site: cl02
    active-passive.arencloud.com/mode: passive
  labels:
    app.kubernetes.io/name: balance-saml
    app.kubernetes.io/component: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: balance-saml
      namespace: balance-saml
      sectionName: https
  hostnames:
    - balance-saml.arencloud.com
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: balance-saml
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
