apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhbk-ldap389-bind-vault
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: rhbk
    app.kubernetes.io/component: ldap389-federation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rhbk-ldap389-bind-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: arencloud_ldap389Bc
      remoteRef:
        key: shared/ldap389/rhbk-bind
        property: bindCredential
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
