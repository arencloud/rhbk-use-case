quarkus.application.name=balance-saml
quarkus.http.port=8080
quarkus.smallrye-openapi.info-title=Balance SAML API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Banking-style demo application protected by RHBK SAML.

balance.saml.entity-id=${SAML_ENTITY_ID:balance-saml}
balance.saml.public-url=${SAML_PUBLIC_URL:http://localhost:8080}
balance.saml.idp-metadata-url=${SAML_IDP_METADATA_URL:https://sso.arencloud.com/realms/arencloud/protocol/saml/descriptor}
balance.saml.idp-entity-id=${SAML_IDP_ENTITY_ID:}
balance.saml.idp-sso-url=${SAML_IDP_SSO_URL:}
balance.saml.session-cookie=${SAML_SESSION_COOKIE:BALANCE_SAML_SESSION}
balance.saml.login-state-cookie=${SAML_LOGIN_STATE_COOKIE:BALANCE_SAML_REQUEST}
balance.saml.trusted-ca-pem=${SAML_TRUSTED_CA_PEM:}

quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit

%test.balance.saml.public-url=http://localhost:8081
%test.balance.saml.idp-metadata-url=http://localhost:8081/mock-idp-metadata
