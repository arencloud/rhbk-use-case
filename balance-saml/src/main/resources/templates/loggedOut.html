<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out - Balance SAML</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(460px, calc(100% - 32px));
      background: #ffffff;
      border: 1px solid #d8dee8;
      border-top: 4px solid #007f7a;
      border-radius: 6px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(20, 33, 61, .08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #657084;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 10px 14px;
      background: #007f7a;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 800;
    }
  </style>
</head>
<body>
<main>
  <h1>Signed out</h1>
  <p>Your local Balance SAML session has ended.</p>
  <a href="/">Sign in again</a>
</main>
</body>
</html>
